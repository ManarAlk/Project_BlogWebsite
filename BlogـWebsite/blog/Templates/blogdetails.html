{% extends "master.html" %}

{% block title %}
{{ blog.title }}
{% endblock %}

{% block content %}

<h1>{{ blog.title }}</h1>

<p>
    <strong>Category:</strong>
    {{ blog.category.name }}
</p>

<p>
    <strong>Date Published:</strong>
    {{ blog.date_published }}
</p>

<h3>Content</h3>

<p>
    {{ blog.content }}
</p>

<p>
    <a href="/blogs/">Back to Blogs</a>
</p>

{% endblock %}
